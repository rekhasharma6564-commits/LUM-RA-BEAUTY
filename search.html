<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Products | LUMÉRA BEAUTY</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="scrollProgress"></div>
  <div id="pageLoader"><div class="loader-brand">LUMÉRA</div><div class="loader-spinner"></div></div>

  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <button class="hamburger-btn action-icon-btn"><i class="fa-solid fa-bars"></i></button>
        <a href="index.html" class="brand-logo"><span class="logo-main">LUMÉRA</span><span class="logo-sub">BEAUTY</span></a>
        <nav class="main-nav">
          <a href="index.html" class="nav-link">Home</a>
          <a href="shop.html" class="nav-link">Shop</a>
          <a href="makeup.html" class="nav-link">Makeup</a>
          <a href="skincare.html" class="nav-link">Skincare</a>
          <a href="offers.html" class="nav-link">Offers</a>
          <a href="about.html" class="nav-link">About</a>
        </nav>
        <div class="header-actions">
          <button class="theme-toggle-btn action-icon-btn"><i class="fa-solid fa-moon"></i></button>
          <a href="wishlist.html" class="action-icon-btn" title="Wishlist"><i class="fa-regular fa-heart"></i><span class="badge-count wishlist-count-badge">0</span></a>
          <a href="cart.html" class="action-icon-btn" title="Cart"><i class="fa-solid fa-bag-shopping"></i><span class="badge-count cart-count-badge">0</span></a>
          <a href="account.html" class="action-icon-btn" title="Account"><i class="fa-regular fa-user"></i></a>
        </div>
      </div>
    </div>
  </header>

  <main class="shop-page-wrap">
    <div class="container">
      <div class="breadcrumbs">
        <a href="index.html">Home</a>
        <i class="fa-solid fa-chevron-right"></i>
        <span>Search Results</span>
      </div>

      <div style="max-width: 600px; margin: 0 0 32px;">
        <form class="search-form" style="width: 100%;">
          <div class="search-input-wrap" style="width: 100%; height: 48px;">
            <i class="fa-solid fa-magnifying-glass search-btn"></i>
            <input type="text" class="search-input" id="searchPageInput" placeholder="Search lipstick, serum, fragrance...">
          </div>
        </form>
      </div>

      <div class="shop-layout-grid">
        <aside class="filter-sidebar">
          <div class="filter-header">
            <h3>Refine Search</h3>
            <button class="btn-clear-filters" id="clearFiltersBtn">Reset</button>
          </div>
          <div class="filter-group">
            <div class="filter-group-title">Category</div>
            <div class="filter-options">
              <label class="filter-option-label"><span><input type="checkbox" name="filterCategory" value="Makeup"> Makeup</span></label>
              <label class="filter-option-label"><span><input type="checkbox" name="filterCategory" value="Skincare"> Skincare</span></label>
              <label class="filter-option-label"><span><input type="checkbox" name="filterCategory" value="Haircare"> Haircare</span></label>
              <label class="filter-option-label"><span><input type="checkbox" name="filterCategory" value="Fragrance"> Fragrance</span></label>
            </div>
          </div>
        </aside>

        <section>
          <div class="shop-controls-bar">
            <div class="results-count" id="resultsCount">Searching...</div>
            <div class="shop-sort-wrap">
              <label for="sortSelect">Sort:</label>
              <select id="sortSelect" class="sort-select">
                <option value="featured">Relevance</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="rating">Rating</option>
              </select>
            </div>
          </div>
          <div class="product-grid" id="shopProductsGrid"></div>
        </section>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="quickViewModal">
    <div class="modal-card">
      <button class="modal-close-btn"><i class="fa-solid fa-xmark"></i></button>
      <div id="quickViewContent"></div>
    </div>
  </div>

  <div id="toastContainer"></div>
  <button id="backToTopBtn"><i class="fa-solid fa-arrow-up"></i></button>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 Luméra Beauty. All Rights Reserved.</div>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/whatsapp.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const query = urlParams.get('q') || '';
      const input = document.getElementById('searchPageInput');
      if (input) input.value = query;
      if (typeof initShopFilterEngine === 'function') {
        initShopFilterEngine();
      }
    });
  </script>
</body>
</html>
