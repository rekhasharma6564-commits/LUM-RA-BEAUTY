<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | LUMÉRA BEAUTY</title>
  <meta name="description" content="Join Luméra Beauty VIP for exclusive discounts, early access, and personalized beauty rituals.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="scrollProgress"></div>
  <div id="pageLoader"><div class="loader-brand">LUMÉRA</div><div class="loader-spinner"></div></div>

  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="index.html" class="brand-logo"><span class="logo-main">LUMÉRA</span><span class="logo-sub">BEAUTY</span></a>
      </div>
    </div>
  </header>

  <main style="padding: 60px 0;">
    <div class="container">
      <div class="auth-card">
        
        <div class="section-title-wrap" style="text-align:center; margin-bottom: 24px;">
          <span class="section-eyebrow">Join the Ritual</span>
          <h1 class="section-title" style="font-size:2rem;">Create Account</h1>
          <p class="section-desc">Unlock 15% off your first luxury order with code <strong>WELCOME15</strong>.</p>
        </div>

        <form id="signupForm">
          <div class="form-group">
            <label class="form-label" for="signupName">Full Name *</label>
            <input type="text" id="signupName" class="form-input" placeholder="e.g. Radhika Sen" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupEmail">Email Address *</label>
            <input type="email" id="signupEmail" class="form-input" placeholder="radhika@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupMobile">Mobile Number *</label>
            <input type="tel" id="signupMobile" class="form-input" placeholder="9887972121" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupPassword">Password *</label>
            <input type="password" id="signupPassword" class="form-input" placeholder="Minimum 6 characters" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="signupConfirmPassword">Confirm Password *</label>
            <input type="password" id="signupConfirmPassword" class="form-input" placeholder="Repeat password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg">
            Create VIP Account
          </button>
        </form>

        <div style="text-align:center; margin-top:24px; padding-top:20px; border-top:1px solid var(--border-color); font-size:0.88rem; color:var(--text-secondary);">
          Already have an account? <a href="login.html" style="color:var(--accent-gold); font-weight:600;">Sign In</a>
        </div>

      </div>
    </div>
  </main>

  <div id="toastContainer"></div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 Luméra Beauty. All Rights Reserved.</div>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
